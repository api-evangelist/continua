aid: continua
name: Continua
description: 'Continua AI, Inc. is a Brooklyn-based startup founded by former Google
  Distinguished Engineer David Petrou and backed by GV, Bessemer Venture Partners,
  and angel investors. Its product, Wheelie, is a public Development OS for agentic
  coding work: a launch-preview platform where an agent starts from an existing checkout
  or public repo, uses a bring-your-own harness, takes one work item, and produces
  one reviewable diff with focused validation evidence. Wheelie ships a first-party
  CLI, a Capability Kit npm package, an agent-readable llms.txt docs index, a public
  support-state matrix, and a private-preview changelog and status page.'
